server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/TanzeemAlam/ecommerce-application-config-repo

eureka:
  client:
    serviceUrl:
      defaultZone: http://172.27.64.1:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}